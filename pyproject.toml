[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "limpide"
version = "0.3.0"
description = "View, strip EXIF, convert HEIC, and shift photo dates — browser app and CLI."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Benoît Prieur" }]
dependencies = [
    "Pillow>=10.0",
    "pillow-heif>=0.16",
    "piexif>=1.1.3",
]

[project.scripts]
limpide = "limpide.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["limpide*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
