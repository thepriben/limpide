<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Effacement EXIF et conversion HEIC en JPEG, dans le navigateur.">
  <title>Limpide</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header>
      <h1>Limpide</h1>
      <p>Effacement EXIF · HEIC → JPEG</p>
    </header>

    <section class="tool">
      <h2>EXIF</h2>
      <p class="hint">JPEG, PNG, WebP</p>
      <label class="dropzone" id="exif-dropzone">
        <input type="file" id="exif-input" accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp" hidden>
        <span>Choisir un fichier</span>
      </label>
      <p class="status" id="exif-status" aria-live="polite"></p>
      <button type="button" id="exif-download" hidden>Télécharger</button>
    </section>

    <section class="tool">
      <h2>HEIC</h2>
      <p class="hint">Conversion en JPEG</p>
      <label class="dropzone" id="heic-dropzone">
        <input type="file" id="heic-input" accept="image/heic,image/heif,.heic,.heif" hidden>
        <span>Choisir un fichier</span>
      </label>
      <p class="status" id="heic-status" aria-live="polite"></p>
      <button type="button" id="heic-download" hidden>Télécharger</button>
    </section>

    <footer>
      <a href="https://github.com/thepriben/limpide">thepriben/limpide</a>
    </footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
